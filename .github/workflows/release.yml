name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repository formatting
        run: python3 scripts/check_format.py
      - name: Version consistency
        run: python3 scripts/check_version.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Test shared code
        run: gradle :shared:allTests --stacktrace
      - name: Lint Android release
        run: gradle :androidApp:lintRelease --stacktrace
      - name: Build unsigned Android release
        run: gradle :androidApp:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rps-arena-android
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Compile desktop application
        run: gradle :desktopApp:classes --stacktrace
      - name: Package Debian distribution
        run: gradle :desktopApp:packageDeb --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rps-arena-linux
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-engine
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust rules engine
        run: cargo test --all-targets
      - name: Package Rust rules engine
        run: cargo package
      - uses: actions/upload-artifact@v4
        with:
          name: rps-arena-rust-engine
          path: rust-engine/target/package/*.crate
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop-linux, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --generate-notes
          --title "RPS Arena ${GITHUB_REF_NAME}"
