name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Run shared tests
        run: gradle --no-daemon :shared:desktopTest

      - name: Build unsigned Android release APK
        run: gradle --no-daemon :androidApp:assembleRelease

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: rps-arena-android-release-unsigned
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Run shared tests
        run: gradle --no-daemon :shared:desktopTest

      - name: Build current OS desktop distributable
        run: gradle --no-daemon :desktopApp:createDistributable

      - name: Upload desktop distributable
        uses: actions/upload-artifact@v4
        with:
          name: rps-arena-desktop-${{ matrix.artifact }}
          path: desktopApp/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 14
