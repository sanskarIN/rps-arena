name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic
      - name: Test shared code
        run: gradle --no-daemon :shared:desktopTest
      - name: Build Android APK
        run: gradle --no-daemon :androidApp:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: rps-arena-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic
      - name: Build current OS desktop distributable
        run: gradle --no-daemon :desktopApp:createDistributable
      - name: Upload desktop distributable
        uses: actions/upload-artifact@v4
        with:
          name: rps-arena-desktop-${{ matrix.artifact }}
          path: desktopApp/build/compose/binaries/main/app/**
          if-no-files-found: error
