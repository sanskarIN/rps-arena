name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Compile shared and desktop code
        run: gradle --no-daemon :shared:compileKotlinDesktop :desktopApp:compileKotlin

      - name: Run shared tests
        run: gradle --no-daemon :shared:desktopTest

      - name: Build Android debug APK
        run: gradle --no-daemon :androidApp:assembleDebug

      - name: Run Android lint
        run: gradle --no-daemon :androidApp:lintDebug
