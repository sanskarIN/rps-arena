name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repository formatting
        run: python3 scripts/check_format.py
      - name: Version consistency
        run: python3 scripts/check_version.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Shared tests
        run: gradle :shared:allTests --stacktrace
      - name: Android lint
        run: gradle :androidApp:lintDebug --stacktrace
      - name: Android debug build
        run: gradle :androidApp:assembleDebug --stacktrace
      - name: Desktop classes
        run: gradle :desktopApp:classes --stacktrace

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-engine
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
