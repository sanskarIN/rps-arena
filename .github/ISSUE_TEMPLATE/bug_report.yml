name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve RPS Arena.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, Windows, macOS, Linux, Shared logic]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Tap…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App/version
  - type: textarea
    id: extra
    attributes:
      label: Additional context
