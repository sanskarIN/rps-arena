name: Bug report
description: Report a reproducible problem in RPS Arena
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve RPS Arena. Do not include secrets or private data.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RPS Arena version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact usernames, paths, tokens, and personal data before posting.
